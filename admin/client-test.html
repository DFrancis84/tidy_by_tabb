<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client API Test</title>

  <style>
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    form,
    pre {
      padding: 20px;
      background: white;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-weight: bold;
    }

    input,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 12px;
      font: inherit;
    }

    button {
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      margin-top: 20px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>Client API Test</h1>

  <form id="client-form">
    <label>
      First name
      <input name="firstName" value="Test" required>
    </label>

    <label>
      Last name
      <input name="lastName" value="Client" required>
    </label>

    <label>
      Email
      <input
        name="email"
        type="email"
        value="test-create@example.com"
      >
    </label>

    <label>
      Phone
      <input name="phone" value="555-555-0101">
    </label>

    <label>
      City
      <input name="city" value="Louisville">
    </label>

    <label>
      State
      <input name="state" value="KY">
    </label>

    <label>
      Notes
      <textarea name="notes">Temporary client API test.</textarea>
    </label>

    <button type="submit">Create Test Client</button>
  </form>

  <pre id="result">Waiting for test...</pre>

  <script>
    const form = document.getElementById("client-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      result.textContent = "Sending request...";

      const formData = new FormData(form);

      const payload = {
        firstName: formData.get("firstName"),
        lastName: formData.get("lastName"),
        email: formData.get("email"),
        phone: formData.get("phone"),
        city: formData.get("city"),
        state: formData.get("state"),
        notes: formData.get("notes"),
      };

      try {
        const response = await fetch("/admin/api/clients", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        });

        const body = await response.json();

        result.textContent = JSON.stringify(
          {
            status: response.status,
            body,
          },
          null,
          2
        );
      } catch (error) {
        result.textContent = String(error);
      }
    });
  </script>
</body>
</html>
